# India country pack manifest (DRAFT) - S-054. Schema: docs/arch/country-pack-model.md
# Moves to config/country-packs/IN/pack.yaml when the repo exists (S-090, S-099).
# Values marked [CONFIRM] = founder, [VALIDATE] = lawyer, [CA] = chartered accountant, [CLINICAL] = doctor reviewer.

pack:
  code: IN
  version: 0.1.0-draft
  status: draft                     # production loads only "approved"
  checksums: {}                     # generated by CI for every referenced file

residency:                          # K-GLB-03, K-DP-01
  region_primary: "[FILL: India region per ADR-09]"
  region_dr: "[FILL: second India region per ADR-09]"
  vendor_processing_must_be_in: [IN]
  exceptions:
    - vendor: push-fcm-apns
      data: [push_token, discreet_notification_text]
      reason: "Google/Apple push services; no health data ever in push text (K-DP-09)"
      approved_by: null             # [VALIDATE] lawyer (data inventory open item 10)

locale:
  default_locale: en-IN
  supported_locales: [en-IN, hi-IN, ta-IN]
  launch_locales: [en-IN]           # founder decision 14 Nov 2026: English app screens at launch
  legal_text_languages: eighth_schedule_on_request   # notices, consent texts, Terms, grievance page (DPDP s.5(3), s.6(3); IT Rules 3(1)(a)) [VALIDATE list]
  default_time_zone: Asia/Kolkata
  date_format: DD/MM/YYYY
  units: metric

money:
  currency: INR
  minor_units: 2
  tax: tax/in-tax.yaml              # [CA] GST on our subscription (18%), receipts by clinic GST status (money-flow T1, T5)

people:
  age_of_majority: 18
  min_account_age: 18               # CH-01; DPDP child = under 18
  phone_country_codes: ["+91"]      # v1.0 only (TM-02)
  prohibited_identifiers:           # K-DP-05, AAD-02, AAD-03
    - id: aadhaar_number
      validator: verhoeff_12_digit_first_2_to_9
      action: reject_input_and_scrub_logs
    - id: aadhaar_vid
      validator: digits_16
      action: reject_input_and_scrub_logs

emergency:                          # K-CS-06: dialled by the phone, never via our servers
  primary_number: "112"             # national Emergency Response Support System
  other_numbers:
    - { number: "108", label: ambulance, note: "most states [VALIDATE per state]" }

clinical:
  prescribing_rules: rules/telemedicine-rules.yaml            # draft: docs/clinical/rules/IN/telemedicine-rules.v1.draft.yaml (v1.1.0-draft) [CLINICAL][VALIDATE]
  drug_classification: drugs/classification.yaml              # built in S-126 [CLINICAL]
  minors_supported: false                                      # product decision (founder decision 3); CH-11 gate for v1.1
  online_consult_patient_countries: [IN]                       # guidelines exclude consultations outside India (review R-02) [VALIDATE]

retention:                          # data-inventory-v1.0.md section 1 [VALIDATE] (RET-04 [CA])
  rules:
    RET-01: { period: account_life, then: legal_minimum_hold_RET-18_then_erase }
    RET-02: { period: years_3, start: last_consult_with_doctor, legal_hold: true, then: restrict_then_delete }
    RET-03: { period: until_deleted_or_account_closed }
    RET-04: { period: years_8, start: end_of_financial_year, then: restrict_then_delete }
    RET-05: { period: account_life_plus_years_3 }
    RET-06: { period: same_as_RET-02, minimum: years_1 }
    RET-07: { period: years_1_rolling }                        # DPDP rule 6(1)(e); CERT-In needs 180 days minimum
    RET-08: { period: listed_plus_years_3, id_document_images: days_90_after_decision }
    RET-09: { period: years_3_after_closure }
    RET-10: { period: days_90 }
    RET-11: { period: months_13, then: aggregate_without_user_key }
    RET-12: { period: ttl_minutes_to_session_end }
    RET-13: { period: until_unsubscribe_or_months_6_after_v1_launch }
    RET-14: { period: days_30_after_pilot_end }
    RET-15: { period: account_life_or_years_3_after_nominee_request }
    RET-16: { period: none, keep: daily_count_only }
    RET-17: { period: days_35_rolling }                        # [CONFIRM] S-062
    RET-18: { registration_data: days_180_after_account_closure, processing_data_and_logs_from_2027_05_13: years_1_from_processing, removed_content: days_180, state: restricted_no_staff_access, then: erase_and_destroy_patient_key }   # IT Rules 3(1)(h),(g); DPDP Rules 8(3) [VALIDATE]

payments:
  settlement_modes_allowed: [clinic_collected, pay_at_clinic]  # split = v1.2 (S-217); pay_at_clinic for in-person only
  refund_policy: payments/refund-policy.yaml                   # draft: docs/payments/refund-policy.v1.draft.yaml (RF08/RF09 blocked, FAIRNESS-01)
  adapter: "[FILL after S-040]"

messaging:
  channels_enabled: { push: true, sms: true, email: true, whatsapp: false }   # WhatsApp ON HOLD (founder, 14 Nov 2026)
  sms_registry: messaging/sms-templates.yaml                   # SMS-01..SMS-16 incl. 07b/07c, typed variables (messaging plan section 4)
  sms_principal_entity_id: "[FILL after DLT registration, S-102]"
  quiet_hours: { start: "21:00", end: "08:00" }                # K-MSG-03; OTP, consult-start, security and chosen-time medicine reminders exempt

legal:
  grievance:
    officer: "[FILL: founder open decision 1]"
    acknowledge_hours: 24
    resolve_days: 7                # IT Rules as amended, in force 20 Feb 2026
    unlawful_content_removal_hours: 36
    order_compliance_hours: 3
    intimate_image_removal_hours: 2
    data_rights_response_days: 15  # our target; DPDP Rules allow up to 90 days
    medical_record_copy_hours: 72  # IMC Regulations 2002 reg. 1.3.2 [VALIDATE]
    appeal: gac.gov.in
  notice_versions: { patient: PN-1.0-draft, provider: PPN-1.0-draft }
  consent_text_versions: { P-ACCOUNT: 1, P-CARE: 2, P-RECORD: 2, P-REMIND: 2, P-SHARE: 1, P-MEDNAMES: 1, P-ANALYTICS: 1, P-NEWS: 1, D-VERIFY: 1, D-PROFILE: 1, D-ANALYTICS: 1, D-STAFF: 1 }

adapters:                           # each must be in the vendor register (adapter rule A3)
  payments: "[S-040]"
  sms: "[S-041]"
  push: push-fcm-apns
  email: "[FILL]"
  video: "[S-039]"
  geocoding: "[FILL]"
  verification: manual              # vendor adapter after the beta (S-111, S-042)
  esign: none                       # blocked until N5 is decided (P09 fails closed)
  age_verification: none            # only if S-017 option A (v1.1)
  ocr: none                         # v1.1
  whatsapp: none                    # ON HOLD

features:
  symptom_search: false             # v1.1; F8 option A recommended (S-022)
  sos: false                        # v1.1
  family_profiles: false            # v1.1; child profiles also need CH-11 protocol
  prescription_scan: false          # v1.1
