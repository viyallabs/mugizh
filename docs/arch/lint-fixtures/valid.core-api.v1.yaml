# Lint fixture (S-038): must produce 0 errors with docs/arch/openapi-lint.spectral.yaml
openapi: 3.1.0
info:
  title: Core API fixture
  version: 1.0.0
  description: Minimal spec that follows every rule in api-standards.md.
  contact:
    name: Platform team
servers:
  - url: https://api.example.test
tags:
  - name: booking
    description: Booking module
paths:
  /v1/appointments:
    get:
      operationId: listAppointments
      summary: List my appointments
      description: Cursor-paginated list of the caller's appointments.
      tags: [booking]
      x-roles: [patient]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: A page of appointments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  nextCursor: { type: string }
        '401':
          description: Not signed in
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/appointments/{appointmentId}/refunds:
    post:
      operationId: requestRefund
      summary: Request a refund
      description: Applies the stored refund policy version.
      tags: [booking]
      x-roles: [patient]
      x-side-effect: money
      parameters:
        - { name: appointmentId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Refund started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer }
        currency: { type: string }
    Appointment:
      type: object
      properties:
        appointmentId: { type: string }
        startAt: { type: string, format: date-time }
        timeZone: { type: string }
        fee: { $ref: '#/components/schemas/Money' }
    Refund:
      type: object
      properties:
        refundId: { type: string }
        status: { type: string, enum: [requested, processing, succeeded, failed] }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        traceId: { type: string }
