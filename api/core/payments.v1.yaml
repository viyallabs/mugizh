openapi: 3.1.0
info:
  title: Core API — payments
  version: 1.0.0
  description: |
    Read-only payment and refund status for the patient, payment status for the clinic admin,
    and one money operation (bring a shortfall refund retry forward). Orders and refunds are
    created by the server from booking events, never from a client request, so no operation
    here accepts an amount (K-PAY-02, TC-58). Hosted checkout only: no card, UPI or bank data
    appears anywhere (K-PAY-01). Another person's resource returns 404 (K-SEC-04).
    The vendor webhook (/webhooks/payments/{clinicLinkRef}) is deliberately NOT in this spec.
tags:
  - name: payments
    description: Payment and refund status
paths:
  /v1/me/appointments/{appointmentId}/payment:
    get:
      operationId: getMyAppointmentPayment
      tags: [payments]
      summary: Status of the payment for my appointment
      x-roles: [patient]
      x-ownership: self
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/me/appointments/{appointmentId}/refund:
    get:
      operationId: getMyAppointmentRefund
      tags: [payments]
      summary: Status of the refund for my appointment, with its reference number
      x-roles: [patient]
      x-ownership: self
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Refund status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/me/appointments/{appointmentId}/payment-document:
    get:
      operationId: getMyPaymentDocument
      tags: [payments]
      summary: The receipt or bill of supply for my appointment's payment, issued in the clinic's name
      description: |
        S-134 (money-flow T1, T5). The document type follows the clinic's tax registration recorded when the
        booking was made: registered clinics issue the registered type with their registration ID; unregistered
        clinics issue a plain receipt with no tax fields. 404 when no document was issued.
      x-roles: [patient]
      x-ownership: self
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDocument' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/clinics/{clinicId}/document-profile:
    put:
      operationId: putClinicDocumentProfile
      tags: [payments]
      summary: Set the legal name, address and tax registration printed on patient documents
      description: |
        S-134. Applies to bookings made afterwards only. Audited. The registration ID is required for, and only for,
        a registered clinic; its format comes from the country pack.
      x-roles: [clinic_admin]
      x-ownership: clinic
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentProfile' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/clinics/{clinicId}/payments:
    get:
      operationId: listClinicPayments
      tags: [payments]
      summary: Payments and refunds of my clinic (no patient identity)
      x-roles: [clinic_admin]
      x-ownership: clinic
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicPaymentList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/clinics/{clinicId}/payments/status:
    get:
      operationId: getClinicPaymentsStatus
      tags: [payments]
      summary: Whether new bookings are paused because refunds could not be paid
      x-roles: [clinic_admin]
      x-ownership: clinic
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: Clinic payments status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicPaymentsStatus' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/clinics/{clinicId}/refunds/{refundId}/retry:
    post:
      operationId: retryClinicRefund
      tags: [payments]
      summary: Retry a refund that waited for clinic balance (after topping up)
      description: Only brings the next retry forward. The retry reuses the refund's own operation key and merchant reference, so it cannot refund twice.
      x-roles: [clinic_admin]
      x-ownership: clinic
      x-side-effect: money
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      responses:
        '202': { description: Retry scheduled }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClinicId:
      name: clinicId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RefundId:
      name: refundId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    DocumentProfile:
      type: object
      additionalProperties: false
      required: [legalName, address, taxStatus]
      properties:
        legalName: { type: string, minLength: 2, maxLength: 120 }
        address: { type: string, minLength: 5, maxLength: 300 }
        taxStatus: { type: string, enum: [registered, unregistered] }
        taxId: { type: string, maxLength: 20 }
    PaymentDocument:
      type: object
      additionalProperties: false
      required: [documentId, appointmentId, documentType, number, issuedOn, clinicLegalName, clinicAddress, amount, currency, paymentReference]
      properties:
        documentId: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        documentType: { type: string, maxLength: 30, description: "Code from the country pack tax configuration, e.g. bill_of_supply or receipt" }
        number: { type: string, maxLength: 40 }
        issuedOn: { type: string, format: date }
        clinicLegalName: { type: string, maxLength: 120 }
        clinicAddress: { type: string, maxLength: 300 }
        clinicTaxId: { type: string, maxLength: 20, description: "Registered clinics only" }
        amount: { type: integer, format: int64, description: "Minor units" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        paymentReference: { type: string, maxLength: 64 }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
    PaymentState:
      type: string
      enum: [pending, paid, expired, failed]
      x-extensible-enum: true
      description: pending covers requested, processing, unknown and created.
    RefundPatientState:
      type: string
      enum: [processing, succeeded, delayed, failed]
      x-extensible-enum: true
      description: delayed means the clinic's account could not fund it yet; we are resolving it with the clinic.
    PaymentStatus:
      type: object
      required: [orderId, status, amount, currency]
      properties:
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentState' }
        amount: { type: integer, format: int64, description: Minor units }
        currency: { type: string, minLength: 3, maxLength: 3 }
        paidAt: { type: string, format: date-time }
    RefundStatus:
      type: object
      required: [refundId, status, amount, currency, ruleId, updatedAt]
      properties:
        refundId: { type: string, format: uuid, description: The reference number shown to the patient }
        status: { $ref: '#/components/schemas/RefundPatientState' }
        amount: { type: integer, format: int64, description: Minor units }
        currency: { type: string, minLength: 3, maxLength: 3 }
        ruleId: { type: string, pattern: '^RF[0-9]{2}$' }
        updatedAt: { type: string, format: date-time }
    ClinicPayment:
      type: object
      required: [orderId, status, amount, currency, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentState' }
        amount: { type: integer, format: int64 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        createdAt: { type: string, format: date-time }
        refundId: { type: string, format: uuid }
        refundStatus: { $ref: '#/components/schemas/RefundPatientState' }
        refundAmount: { type: integer, format: int64 }
    ClinicPaymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClinicPayment' }
        nextCursor: { type: string }
    ClinicPaymentsStatus:
      type: object
      required: [paused, delayedRefunds]
      properties:
        paused: { type: boolean }
        pausedSince: { type: string, format: date-time }
        delayedRefunds: { type: integer }
