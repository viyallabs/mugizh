# Local stack (S-090). Synthetic data only. Not used for staging or production.
name: mugizh-local
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_pw
      POSTGRES_DB: mugizh
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - mugizh-db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./.secrets/owner_pw:/run/secrets/owner_pw:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d mugizh"]
      interval: 2s
      retries: 30
  # The production images against the local database (profile "app"): `docker compose --profile app up -d`
  # after `bash deploy/local/up.sh` and `docker build -f deploy/images/core.Dockerfile -t mugizh-core:local .`.
  # Same image as staging and production (D-88), with local settings: fake vendors, synthetic data only.
  api:
    profiles: ["app"]
    image: mugizh-core:local
    env_file: .env
    environment:
      MUGIZH_PACK_DIR: /app/config/country-packs/IN
      MUGIZH_VENDOR_REGISTER: /app/config/vendor-register.yaml
      MUGIZH_BLOB_DIR: /data/blobs
    read_only: true
    volumes: ["mugizh-blobs:/data/blobs"]
    ports: ["127.0.0.1:18080:8080"]
    depends_on: { db: { condition: service_healthy } }
  worker:
    profiles: ["app"]
    image: mugizh-core:local
    entrypoint: ["/app/worker"]
    env_file: .env
    environment:
      MUGIZH_PACK_DIR: /app/config/country-packs/IN
      MUGIZH_VENDOR_REGISTER: /app/config/vendor-register.yaml
      MUGIZH_BLOB_DIR: /data/blobs
      HTTP_ADDR: ":8082"
    read_only: true
    volumes: ["mugizh-blobs:/data/blobs"]
    depends_on: { db: { condition: service_healthy } }
volumes:
  mugizh-db: {}
  mugizh-blobs: {}
