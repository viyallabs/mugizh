# Server-side notification text (K-GLB-02: translation keys; apps hold their own strings).
# Never a diagnosis, condition or doctor's specialty (K-DP-09). Medicine names appear only
# through the named reminder text, sent only with P-MEDNAMES.
notif.title: "Reminder"
notif.reminder.body: "It's time for your medicine."
notif.reminder.named.body: "Time to take {medicine_name}."
notif.reminders.grouped: "You have {count} reminders now."
notif.followup.body: "You have a test or follow-up due."
notif.followup.discreet.body: "You have a health reminder."
timeofday.morning: "morning"
timeofday.afternoon: "afternoon"
timeofday.evening: "evening"
timeofday.night: "night"
notif.security.title: "Account security"
notif.rights.erasure_requested: "A request to delete your account was made (ref {reference}). If this was not you, cancel it in Settings or contact us."
notif.rights.erasure_cancelled: "The request to delete your account (ref {reference}) was cancelled."
notif.rights.completed: "Your data request ref {reference} is complete."
notif.prescription.ready: "Your prescription is ready in the app."
notif.prescription.amended: "Your doctor updated your prescription. Your reminders have been updated."
# S-157 booking, consult and refund messages. Wording mirrors the registered SMS templates
# (config/country-packs/IN/messaging/sms-templates.yaml) [CONFIRM wording, messaging plan section 8].
# Booking messages never mention money; refund messages only state what payments decided.
notif.appointment.title: "Appointment"
notif.refund.title: "Refund"
notif.booking.confirmed: "Your appointment with {doctor_name} is confirmed for {date_time}."
notif.booking.rescheduled: "Your appointment with {doctor_name} has moved to {date_time}."
notif.appointment.reminder: "Reminder: your appointment with {doctor_name} is at {date_time}."
notif.consult.starting: "Your online consultation with {doctor_name} starts at {date_time}. Open the app to join."
notif.booking.cancelled_by_clinic: "Sorry, your appointment on {date_time} was cancelled by the clinic. Details are in the app."
notif.booking.closed_online: "Your online consultation on {date_time} did not go ahead as booked. Next steps are in the app."
notif.booking.doctor_absent: "Your doctor was not available for your appointment on {date_time}. You can book again in the app."
notif.booking.reschedule_needed: "Your appointment on {date_time} needs a new time. Choose one in the app."
notif.refund.clinic_cancelled: "A full refund of Rs {amount} for your cancelled appointment on {date_time} has started (ref {reference})."
notif.refund.doctor_absent: "A full refund of Rs {amount} for your consultation on {date_time} has started (ref {reference})."
notif.refund.payment_returned: "Your payment of Rs {amount} did not complete a booking. It will be returned automatically (ref {reference})."
notif.refund.started: "Your refund of Rs {amount} (ref {reference}) has started. Banks usually take 5-7 working days."
notif.refund.succeeded: "Your refund of Rs {amount} (ref {reference}) has been sent to your bank."
notif.refund.delayed: "Your refund of Rs {amount} (ref {reference}) is delayed. We are working on it; see the app for help."
# S-168/S-169 history sharing (E-DP-02). No patient name on the doctor's notice; no specialty.
notif.sharing.title: "Health history sharing"
notif.sharing.extension_requested: "{doctor_name} asked for more time to see your shared health history. Review the request in the app."
notif.sharing.extension_approved: "Your request for more time to see a shared history was approved."
notif.sharing.extension_declined: "Your request for more time to see a shared history was declined."
notif.documents.title: "Your documents"
notif.documents.quarantined: "A document you uploaded seems to show an Aadhaar number, so we have hidden it and will delete it. If you still need it, upload a copy with the number covered."
